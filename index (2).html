<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b2b">
<title>PokeTibia — Kanto Alpha</title>
<style>
:root{--bg:#0b1320;--panel:#17263a;--panel2:#0e1a2b;--line:#354b67;--gold:#ffd36e;--muted:#9eafc6;--green:#64d69a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#eef5ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:980px;margin:auto;background:#0b1422}
header{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#111e30;border-bottom:1px solid #30445e}
.brand{font-weight:900;letter-spacing:.5px}.brand small{display:block;color:#9eafc6;font-weight:500;font-size:10px;letter-spacing:0}
.hud{display:flex;gap:10px;font-size:11px;text-align:right;color:#dce8f8}.hud b{color:var(--gold);font-size:13px}
#scene{position:relative;flex:1;min-height:0;background:#284f39;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#maptag{position:absolute;top:9px;left:9px;padding:5px 8px;border-radius:7px;background:#07111bd9;border:1px solid #ffffff26;font-size:11px}
#toast{position:absolute;top:9px;left:50%;transform:translateX(-50%);background:#08131ee8;padding:7px 10px;border:1px solid #536a84;border-radius:8px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#righttop{position:absolute;right:9px;top:9px;display:flex;flex-direction:column;gap:6px}
.pill{background:#08131bdc;border:1px solid #ffffff26;border-radius:8px;padding:6px 8px;font-size:10px}
#bottomHud{position:absolute;left:9px;right:9px;bottom:9px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#bottomHud>*{pointer-events:auto}
#joystick{width:116px;height:116px;border-radius:50%;background:#07111b99;border:2px solid #d9e8ff55;position:relative;touch-action:none;box-shadow:0 4px 18px #0005}
#stick{width:48px;height:48px;border-radius:50%;background:linear-gradient(#d7e4f3,#7e93ae);border:2px solid #fff9;position:absolute;left:32px;top:32px;box-shadow:0 3px 8px #0008}
#actionButtons{display:flex;gap:7px;align-items:end}
.action{width:58px;height:58px;border-radius:50%;border:2px solid #ffffff55;background:linear-gradient(145deg,#e5b94e,#9a6923);color:#1c2430;font-weight:900;font-size:11px;box-shadow:0 4px 12px #0006}
.action.blue{background:linear-gradient(145deg,#8ecbff,#326a9b);color:#071726}
#lower{flex:none;background:#111e30;border-top:1px solid #30445e;padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted)}.tiny{font-size:10px;color:var(--muted)}
#party{display:flex;gap:7px;overflow-x:auto;margin-top:7px;padding-bottom:2px}
.mon{min-width:82px;background:#0c1828;border:1px solid #344b67;border-radius:9px;padding:6px;text-align:center}
.mon.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mon canvas{width:42px;height:42px;margin:auto;image-rendering:pixelated}
.mon b{display:block;font-size:10px}.mon small{font-size:9px;color:var(--muted)}
#battleline{display:flex;align-items:center;gap:8px;margin-top:7px;background:#0c1828;border-radius:9px;padding:7px}
#enemySprite{width:42px;height:42px;flex:none}
#enemySprite canvas{width:42px;height:42px}
#enemyInfo{flex:1;min-width:0}.bar{height:6px;background:#26364b;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#60d69b;width:100%}
#feed{font-size:10px;color:#b8c8dc;max-width:38%;text-align:right;line-height:1.35}
#tabs{height:38px;display:flex;gap:5px;margin-top:7px}
.tab{flex:1;border:1px solid #344b67;border-radius:8px;background:#1b2b41;color:#cbd9eb;font-size:11px;font-weight:700}
.tab.active{background:#344963;color:var(--gold);border-color:#8b7749}
#modal{position:absolute;inset:0;background:#030914bb;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
#modal.show{display:flex}.card{width:min(420px,100%);background:#17263a;border:1px solid #536a84;border-radius:15px;padding:14px;box-shadow:0 12px 40px #0009}
.card h3{margin:0 0 10px}.card button{border:1px solid #536a84;border-radius:8px;padding:9px;background:#263d58;color:white;font-weight:700}
#areaList{display:grid;grid-template-columns:1fr 1fr;gap:7px}.areaBtn{text-align:left}
@media(min-width:700px){#app{border-left:1px solid #263d55;border-right:1px solid #263d55}#lower{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">⚡ POKETIBIA <small>KANTO ALPHA • MMORPG IDLE</small></div><div class="hud"><div><b id="level">Nv. 5</b><br><span id="xp">XP 0/100</span></div><div><b id="coins">250</b><br>Pokédólares</div><div><b id="balls">10</b><br>Pokébolas</div></div></header>
<div id="scene">
 <canvas id="world" width="640" height="400"></canvas>
 <div id="maptag">ROTA 1 · KANTO</div><div id="toast"></div>
 <div id="righttop"><div class="pill" id="coords">X 12 · Y 10</div><div class="pill">AUTO ⚔ ATIVO</div></div>
 <div id="bottomHud">
  <div id="joystick"><div id="stick"></div></div>
  <div id="actionButtons"><button class="action blue" id="bag">BOLSA</button><button class="action" id="catch">CAPTURAR</button></div>
 </div>
 <div id="modal"><div class="card"><h3 id="modalTitle">Áreas de Kanto</h3><div id="modalBody"></div><div style="text-align:right;margin-top:12px"><button id="closeModal">Fechar</button></div></div></div>
</div>
<div id="lower">
 <div class="row"><b style="font-size:12px">Equipe do treinador</b><span class="tiny" id="teamcount">1/6 Pokémon</span><span class="tiny" id="badgecount">Insígnias 0/8</span></div>
 <div id="party"></div>
 <div id="battleline"><div id="enemySprite"></div><div id="enemyInfo"><div class="row"><b id="enemyName" style="font-size:11px">Pidgey selvagem</b><span class="tiny" id="enemyHp">HP 100%</span></div><div class="bar"><i id="enemyBar"></i></div><div class="tiny" id="battleStatus">Explorando…</div></div><div id="feed">Encontros automáticos</div></div>
 <div id="tabs"><button class="tab active" data-modal="areas">🗺️ MAPA</button><button class="tab" data-modal="dex">📖 POKÉDEX</button><button class="tab" data-modal="bag">🎒 BOLSA</button><button class="tab" data-modal="profile">👤 TREINADOR</button></div>
</div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), cvs=$("world"),ctx=cvs.getContext("2d");
const W=32,H=24,T=32;
const species=[
{id:1,name:"Bulbasaur",type:"Planta",hp:45,atk:12,color:"#65b65b",body:"#65b65b",accent:"#3b7b45"},
{id:4,name:"Charmander",type:"Fogo",hp:39,atk:14,color:"#f28a45",body:"#f28a45",accent:"#ffd16a"},
{id:7,name:"Squirtle",type:"Água",hp:44,atk:12,color:"#69b9e8",body:"#69b9e8",accent:"#d2efff"},
{id:25,name:"Pikachu",type:"Elétrico",hp:35,atk:15,color:"#f5d44e",body:"#f5d44e",accent:"#9e642d"},
{id:16,name:"Pidgey",type:"Normal/Voador",hp:30,atk:9,color:"#ad8a61",body:"#ad8a61",accent:"#e4c99b"},
{id:19,name:"Rattata",type:"Normal",hp:32,atk:10,color:"#a879bd",body:"#a879bd",accent:"#e0b6dc"},
{id:10,name:"Caterpie",type:"Inseto",hp:38,atk:8,color:"#71bb61",body:"#71bb61",accent:"#e5d75b"},
{id:74,name:"Geodude",type:"Pedra",hp:50,atk:13,color:"#9d9387",body:"#9d9387",accent:"#d4c8b5"},
{id:92,name:"Gastly",type:"Fantasma",hp:32,atk:15,color:"#9477c9",body:"#9477c9",accent:"#d5b7ff"},
{id:133,name:"Eevee",type:"Normal",hp:40,atk:13,color:"#b98250",body:"#b98250",accent:"#f1d7a4"}
];
const areas=[
{name:"Rota 1",level:1,theme:0,desc:"Pallet → Viridian",spawns:[4,5,6]},
{name:"Floresta de Viridian",level:3,theme:1,desc:"Bosque fechado",spawns:[6,4,5]},
{name:"Rota 3",level:5,theme:0,desc:"Caminho de Pewter",spawns:[4,5,7]},
{name:"Mt. Moon",level:7,theme:2,desc:"Caverna misteriosa",spawns:[7,8,5]},
{name:"Rota 5",level:10,theme:0,desc:"Arredores de Cerulean",spawns:[4,9,6]}
];
let state=JSON.parse(localStorage.getItem("poketibia-alpha")||"null")||{level:5,xp:0,coins:250,balls:10,badges:0,area:0,player:{x:13,y:11},team:[{id:0,level:5,hp:45},{id:3,level:4,hp:35},{id:2,level:4,hp:44}],dex:[1,25,7],wins:0,last:Date.now()};
let map=[],cam={x:0,y:0},keys={x:0,y:0},joystick={active:false,id:null,x:0,y:0},last=performance.now(),moveTimer=0,battleTimer=0,enemy=null,enemyHP=0,toastTimer=0,walkFrame=0;
function rand(n){return Math.floor(Math.random()*n)}
function save(){state.last=Date.now();localStorage.setItem("poketibia-alpha",JSON.stringify(state))}
function tileAt(x,y){if(x<0||y<0||x>=W||y>=H)return 1;return map[y][x]}
function makeMap(){
 map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{
  let v=(x*37+y*19+x*y*3+state.area*11)%23;
  if(x===0||y===0||x===W-1||y===H-1)return 1;
  if((x>22&&x<28&&y>3&&y<8)||(x>4&&x<8&&y>16&&y<20))return 3;
  if((x===15||x===16)&&y>2&&y<22)return 2;
  if(v<4)return 1;
  return 0;
 }));
 // central dirt trail and small clearing
 for(let x=2;x<30;x++){map[11][x]=2;map[12][x]=2}
 for(let y=7;y<17;y++){map[y][15]=2;map[y][16]=2}
 for(let y=9;y<15;y++)for(let x=12;x<20;x++)map[y][x]=0;
 // house/building footprint
 for(let y=4;y<7;y++)for(let x=3;x<7;x++)map[y][x]=4;
 state.player.x=13;state.player.y=11;
}
function sprite(ctx,x,y,id,scale=1,frame=0){
 const s=species.find(p=>p.id===id)||species[0],u=scale;
 ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(u,u);
 // shadow
 ctx.fillStyle="#17251c99";ctx.fillRect(-7,8,15,4);
 // body pixels, creature-specific silhouette
 if(id===16){ctx.fillStyle=s.body;ctx.fillRect(-7,-4,14,10);ctx.fillRect(-3,-9,8,7);ctx.fillStyle=s.accent;ctx.fillRect(-8,-7,6,4);ctx.fillRect(3,-11,4,3);ctx.fillRect(5,-2,5,3)}
 else if(id===19){ctx.fillStyle=s.body;ctx.fillRect(-7,-3,14,10);ctx.fillRect(2,-8,7,7);ctx.fillStyle=s.accent;ctx.fillRect(5,-6,2,2);ctx.fillRect(-10,1,4,3)}
 else if(id===10){ctx.fillStyle=s.body;ctx.fillRect(-8,-3,16,9);ctx.fillRect(-5,-7,10,5);ctx.fillStyle=s.accent;ctx.fillRect(-5,-7,3,3);ctx.fillRect(2,-7,3,3)}
 else if(id===74){ctx.fillStyle=s.body;ctx.fillRect(-8,-7,16,15);ctx.fillStyle=s.accent;ctx.fillRect(-5,-4,3,3);ctx.fillRect(2,-4,3,3);ctx.fillRect(-3,4,6,3)}
 else if(id===92){ctx.fillStyle="#7052aa";ctx.fillRect(-9,-4,18,10);ctx.fillRect(-6,-9,12,7);ctx.fillStyle="#e5c9ff";ctx.fillRect(-5,-3,3,3);ctx.fillRect(3,-3,3,3)}
 else {ctx.fillStyle=s.body;ctx.fillRect(-7,-5,14,13);ctx.fillRect(-5,-9,10,6);ctx.fillStyle=s.accent;ctx.fillRect(-6,-11,3,4);ctx.fillRect(3,-11,3,4);ctx.fillRect(-4,2,3,3);ctx.fillRect(2,2,3,3)}
 ctx.fillStyle="#17202b";ctx.fillRect(-4,-4,2,2);ctx.fillRect(3,-4,2,2);
 ctx.restore();
}
function drawTile(x,y,t){
 let c=t===0?"#5b9950":t===1?"#2f6942":t===2?"#c2aa70":t===3?"#397fa0":"#8d5542";
 ctx.fillStyle=c;ctx.fillRect(x,y,T,T);
 if(t===0){ctx.fillStyle="#6cad5b";ctx.fillRect(x+5,y+5,3,3);ctx.fillRect(x+22,y+18,3,3)}
 if(t===1){ctx.fillStyle="#235435";ctx.fillRect(x+4,y+3,24,25);ctx.fillStyle="#397d49";ctx.fillRect(x+8,y+1,16,17);ctx.fillStyle="#72583c";ctx.fillRect(x+13,y+20,6,12)}
 if(t===2){ctx.fillStyle="#d2bd84";ctx.fillRect(x,y+13,32,3);ctx.fillRect(x+14,y,3,32)}
 if(t===3){ctx.fillStyle="#5ba1bd";ctx.fillRect(x+3,y+3,26,26)}
 if(t===4){ctx.fillStyle="#d7b77d";ctx.fillRect(x+4,y+8,24,24);ctx.fillStyle="#54372e";ctx.fillRect(x+12,y+17,8,15);ctx.fillStyle="#b86c4b";ctx.fillRect(x+1,y+3,30,7)}
}
function drawPlayer(x,y){
 ctx.fillStyle="#17251c99";ctx.fillRect(x-8,y+9,16,4);
 ctx.fillStyle="#315f9a";ctx.fillRect(x-6,y-2,12,12);ctx.fillStyle="#e5b88c";ctx.fillRect(x-5,y-10,10,9);
 ctx.fillStyle="#253b59";ctx.fillRect(x-7,y-12,14,4);ctx.fillRect(x-5,y-15,10,4);
 ctx.fillStyle="#26354b";ctx.fillRect(x-5,y+9,4,5);ctx.fillRect(x+2,y+9,4,5);
}
function draw(){
 let rect=cvs.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 if(cvs.width!==Math.floor(rect.width*dpr)||cvs.height!==Math.floor(rect.height*dpr)){cvs.width=Math.floor(rect.width*dpr);cvs.height=Math.floor(rect.height*dpr)}
 let sx=cvs.width/rect.width,sy=cvs.height/rect.height;ctx.setTransform(sx,0,0,sy,0,0);
 let vw=rect.width,vh=rect.height,scale=Math.min(vw/480,vh/300),tile=32*scale;
 let worldW=W*tile,worldH=H*tile;cam.x=Math.max(0,Math.min(worldW-vw,state.player.x*tile-vw/2));cam.y=Math.max(0,Math.min(worldH-vh,state.player.y*tile-vh/2));
 ctx.fillStyle="#203b2e";ctx.fillRect(0,0,vw,vh);
 let ox=-cam.x,oy=-cam.y;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(x*tile+ox,y*tile+oy,map[y][x]);
 // landmarks and path decorations
 ctx.fillStyle="#f2e0a0";ctx.fillRect(5*tile+ox,5*tile+oy,2*tile,tile*.5);
 let px=state.player.x*tile+ox+tile/2,py=state.player.y*tile+oy+tile/2;
 // followers trail
 state.team.slice(0,6).forEach((m,i)=>{let a=(i+1)*.9;let fx=px-Math.cos(walkFrame*.02)*0-(i+1)*tile*.48,fy=py+Math.sin(walkFrame*.025+i)*tile*.34+tile*.35;sprite(ctx,fx,fy,m.id,Math.max(.8,scale*1.05),walkFrame)});
 drawPlayer(px,py);
 if(enemy&&enemy.active){sprite(ctx,enemy.x*tile+ox+tile/2,enemy.y*tile+oy+tile/2,enemy.id,Math.max(.9,scale*1.15),walkFrame)}
 // subtle grid
 ctx.strokeStyle="#172d2530";ctx.lineWidth=1;for(let x=0;x<vw;x+=tile) {ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,vh);ctx.stroke()}
}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),1700)}
function setEnemy(){let pool=areas[state.area].spawns,id=pool[rand(pool.length)],x=Math.max(3,Math.min(W-3,state.player.x+(rand(7)-3))),y=Math.max(3,Math.min(H-3,state.player.y+(rand(7)-3)));if(tileAt(x,y)===1){x=state.player.x+2;y=state.player.y}enemy={id,x,y,active:true};enemyHP=(species.find(p=>p.id===id).hp+state.level*3);updateEnemy()}
function updateEnemy(){let p=species.find(p=>p.id===enemy.id);$("enemyName").textContent=p.name+" selvagem";$("enemyHp").textContent="HP "+Math.max(0,Math.round(enemyHP/(p.hp+state.level*3)*100))+"%";$("enemyBar").style.width=Math.max(0,enemyHP/(p.hp+state.level*3)*100)+"%";$("enemySprite").innerHTML="";let c=document.createElement("canvas");c.width=42;c.height=42;$("enemySprite").appendChild(c);sprite(c.getContext("2d"),21,23,enemy.id,1.45)}
function render(){
 $("level").textContent="Nv. "+state.level;$("xp").textContent="XP "+state.xp+"/"+(state.level*80);$("coins").textContent=state.coins;$("balls").textContent=state.balls;$("badgecount").textContent="Insígnias "+state.badges+"/8";
 $("maptag").textContent=areas[state.area].name.toUpperCase()+" · KANTO";$("coords").textContent="X "+Math.floor(state.player.x)+" · Y "+Math.floor(state.player.y);
 $("teamcount").textContent=state.team.length+"/6 Pokémon";
 $("party").innerHTML="";state.team.forEach((m,i)=>{let p=species.find(x=>x.id===m.id),el=document.createElement("div");el.className="mon"+(i===0?" active":"");let c=document.createElement("canvas");c.width=42;c.height=42;sprite(c.getContext("2d"),21,23,m.id,1.5);el.append(c);let b=document.createElement("b");b.textContent=p.name;let sm=document.createElement("small");sm.textContent="Nv. "+m.level+" • "+m.hp+" HP";el.append(b,sm);$("party").append(el)});
}
function logBattle(t){$("feed").textContent=t}
function doBattle(){if(!enemy||!enemy.active)return;let living=state.team.filter(m=>m.hp>0);if(!living.length){state.team.forEach(m=>m.hp=species.find(p=>p.id===m.id).hp);toast("Equipe recuperada no Centro Pokémon");return}
 let atk=state.team.reduce((n,m)=>n+(species.find(p=>p.id===m.id).atk+m.level*2),0);enemyHP-=Math.max(4,Math.floor(atk/3));
 if(enemyHP<=0){let p=species.find(x=>x.id===enemy.id);state.wins++;state.coins+=12;state.xp+=14;state.dex=state.dex||[];if(!state.dex.includes(p.id))state.dex.push(p.id);if(state.xp>=state.level*80){state.xp-=state.level*80;state.level++;toast("Subiu para o nível "+state.level+"!")}
 logBattle("Vitória! +14 XP • +12 moedas");enemy.active=false;save();setTimeout(()=>{setEnemy();render()},1200)
 }else logBattle("Sua equipe atacou "+species.find(p=>p.id===enemy.id).name);
 updateEnemy();save();
}
function move(dx,dy){let nx=state.player.x+dx,ny=state.player.y+dy;if(tileAt(nx,ny)===1||tileAt(nx,ny)===3||tileAt(nx,ny)===4)return;state.player.x=nx;state.player.y=ny;walkFrame++;$("coords").textContent="X "+nx+" · Y "+ny; if(Math.random()<.17&&!enemy?.active){setEnemy();toast("Um Pokémon selvagem apareceu!")} }
function loop(now){let dt=Math.min(50,now-last);last=now;let vx=keys.x,vy=keys.y;if(Math.abs(vx)+Math.abs(vy)>.1){moveTimer+=dt;if(moveTimer>145){let dx=Math.abs(vx)>.35?(vx>0?1:-1):0,dy=Math.abs(vy)>.35?(vy>0?1:-1):0;if(Math.abs(vx)>Math.abs(vy))dy=0;else dx=0;move(dx,dy);moveTimer=0}}
 battleTimer+=dt;if(enemy?.active&&battleTimer>1600){doBattle();battleTimer=0}
 draw();requestAnimationFrame(loop)}
function joyStart(e){e.preventDefault();joystick.active=true;joystick.id=e.pointerId;$("joystick").setPointerCapture(e.pointerId);joyMove(e)}
function joyMove(e){if(!joystick.active||e.pointerId!==joystick.id)return;let r=$("joystick").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=34,len=Math.hypot(dx,dy);if(len>lim){dx=dx/len*lim;dy=dy/len*lim}$("stick").style.transform=`translate(${dx}px,${dy}px)`;keys.x=dx/lim;keys.y=dy/lim}
function joyEnd(e){if(e.pointerId!==joystick.id)return;joystick.active=false;keys.x=0;keys.y=0;$("stick").style.transform="translate(0,0)"}
$("joystick").addEventListener("pointerdown",joyStart);$("joystick").addEventListener("pointermove",joyMove);$("joystick").addEventListener("pointerup",joyEnd);$("joystick").addEventListener("pointercancel",joyEnd);
window.addEventListener("keydown",e=>{if(["ArrowUp","w"].includes(e.key))keys.y=-1;if(["ArrowDown","s"].includes(e.key))keys.y=1;if(["ArrowLeft","a"].includes(e.key))keys.x=-1;if(["ArrowRight","d"].includes(e.key))keys.x=1});
window.addEventListener("keyup",e=>{if(["ArrowUp","w","ArrowDown","s"].includes(e.key))keys.y=0;if(["ArrowLeft","a","ArrowRight","d"].includes(e.key))keys.x=0});
$("catch").onclick=()=>{if(!enemy?.active){toast("Nenhum Pokémon para capturar");return}if(state.balls<1){toast("Sem Pokébolas!");return}state.balls--;let p=species.find(x=>x.id===enemy.id),chance=.42;if(Math.random()<chance&&state.team.length<6){state.team.push({id:p.id,level:Math.max(1,state.level),hp:p.hp});toast(p.name+" capturado!");enemy.active=false;setTimeout(setEnemy,1000)}else toast("A captura falhou!");save();render()};
$("bag").onclick=()=>openModal("bag");$("closeModal").onclick=()=>$("modal").classList.remove("show");
function openModal(kind){let title="",body="";if(kind==="areas"){title="Regiões e áreas de Kanto";body='<div id="areaList">'+areas.map((a,i)=>`<button class="areaBtn" ${state.level<a.level?'disabled':''} data-area="${i}">${a.name}<br><small>Nível ${a.level}+ · ${a.desc}</small></button>`).join("")+'</div>'}
if(kind==="dex"){title="Pokédex";body=(state.dex||[]).map(id=>{let p=species.find(x=>x.id===id);return `<p>${p.name} · ${p.type}</p>`}).join("")||"Ainda não descobriu Pokémon."}
if(kind==="bag"){title="Mochila";body=`<p>Pokébolas: ${state.balls}</p><p>Pokédólares: ${state.coins}</p><button id="buyBalls">Comprar 5 Pokébolas · 50 moedas</button>`}
if(kind==="profile"){title="Treinador";body=`<p>Nível ${state.level}</p><p>Vitórias: ${state.wins||0}</p><p>Insígnias: ${state.badges}/8</p><p>Equipe: ${state.team.length}/6</p>`}
$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.add("show");
document.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{let i=+b.dataset.area;if(state.level<areas[i].level)return;state.area=i;makeMap();enemy=null;setEnemy();$("modal").classList.remove("show");toast("Área: "+areas[i].name);save()});
let buy=$("buyBalls");if(buy)buy.onclick=()=>{if(state.coins>=50){state.coins-=50;state.balls+=5;render();openModal("bag");save()}else toast("Moedas insuficientes")};
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");openModal(b.dataset.modal)});
function offline(){let elapsed=Math.min(24*3600000,Math.max(0,Date.now()-(state.last||Date.now())));if(elapsed>60000){let battles=Math.floor(elapsed/60000*0.55);state.wins=(state.wins||0)+battles;state.coins+=battles*8;state.xp+=battles*8;while(state.xp>=state.level*80){state.xp-=state.level*80;state.level++}toast("Progresso offline: "+battles+" batalhas simuladas");}state.last=Date.now()}
offline();makeMap();setEnemy();render();requestAnimationFrame(loop);setInterval(save,10000);
})();
</script>
</body>
</html>
